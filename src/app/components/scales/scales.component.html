<div class="wrapper-container">
  <mat-card class="the-card">

    <mat-card *ngIf="showGuitar">

      <div style="height: 40px;">
 <section class="mat-typography" style="float: left;">
          <h2>GUITAR </h2>
        </section>
        <button (click)="showGuitarOptions= (!showGuitarOptions)" mat-icon-button style="float: right; margin: -5px;">
          <mat-icon>settings</mat-icon>
        </button>
      </div>

      <!-- GUITAR OPTIONS -->
      <mat-card *ngIf="showGuitarOptions" style="
			margin-bottom: 10px;
		">

        <section class="mat-typography">
          <h4>GUITAR OPTIONS</h4>
        </section>

        <mat-accordion>

          <mat-expansion-panel [expanded]="panelState['fretsAmount']" (opened)="setPanelState('fretsAmount', true)" (closed)="setPanelState('fretsAmount', false)">
            <mat-expansion-panel-header>
              <mat-panel-title style="width: 10%;">
                FRETS AMOUNT
              </mat-panel-title>
              <mat-panel-description>
                CURRENTLY: <b>{{cantidadTrastes}}</b>
              </mat-panel-description>
            </mat-expansion-panel-header>

            <mat-card>

              <mat-slider min="5" max="25" step="1">
                <input matSliderThumb [(ngModel)]="cantidadTrastes" (input)="onFretsAmountChange()"
                  (change)="onFretsAmountChange()" />
              </mat-slider>
            </mat-card>

          </mat-expansion-panel>


          <mat-expansion-panel [expanded]="panelState['strings']" (opened)="setPanelState('strings', true)" (closed)="setPanelState('strings', false)">
            <mat-expansion-panel-header>
              <mat-panel-title style="width: 10%;">
                STRINGS
              </mat-panel-title>
              <mat-panel-description>
                CURRENTLY
              </mat-panel-description>
            </mat-expansion-panel-header>

            <mat-card>
              <div class="strings-container">
                <mat-form-field *ngFor="let cuerda of cuerdas; let i = index" class="string-field">
                  <mat-label>Str. {{i+1}}</mat-label>
                  <mat-select [(ngModel)]="cuerdas[i]" (selectionChange)="diapasonConstructor()">
                    <mat-option *ngFor="let note of notes" [value]="note.noteStr">
                      {{ note.noteStr }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

              <div class="strings-actions">
                <button mat-raised-button (click)="onClickAddString()" color="primary" class="btn">
                  <mat-icon>add</mat-icon>
                  ADD
                </button>

                <button mat-raised-button (click)="onClickDeleteString()" color="primary" class="btn">
                  <mat-icon>delete</mat-icon>
                  DEL
                </button>
              </div>
            </mat-card>

          </mat-expansion-panel>


        </mat-accordion>

      </mat-card>
      <!-- /guitar options -->








      <!-- <img src="assets/img/rosewood.jpg"> -->
      <div class="guitar-container">
        <table class="guitar">
          <tr class="trastes-numeros">
            <td *ngFor="let trastes of cantidadTrastesArr">
              <span>{{trastes}}</span>
            </td>
          </tr>

          <tr *ngFor="let diap of diapason" class="string">

            <!--
								[ngClass]="{
								'active' : d.active,
								'active tonic' : d.root && d.active
								}"
							-->

            <td *ngFor="let d of diap" [ngClass]="{
									'tonic': d.root && d.active,
									'third': isThird(d),
									'seventh': isSeventh(d),
									'active': d.active
								}" (click)="onClickNote(d)">
              <span>{{d.noteStr}}</span>
              <!-- <span>{{d|json}}</span> -->
            </td>
          </tr>

          <tr class="trastes-puntitos">
            <td *ngFor="let trastes of cantidadTrastesArr" [ngClass]="
							{
								'two': renderPuntitosGuitarClassCss(trastes)===2,
								'one': renderPuntitosGuitarClassCss(trastes)===1
							}">
              <span></span>
            </td>
          </tr>

        </table>
      </div>
    </mat-card>

    <br *ngIf="showGuitar">

    <mat-card *ngIf="showPiano">

      <div style="height: 40px;">
        <section class="mat-typography" style="float: left;">
          <h2>
            PIANO
          </h2>
        </section>

        <button (click)="showPianoOptions= (!showPianoOptions)" mat-icon-button style="float: right; margin: -5px;">
          <mat-icon>settings</mat-icon>
        </button>
      </div>


      <!-- piano options -->
      <mat-card *ngIf="showPianoOptions">

        <section class="mat-typography">
          <h4> PIANO OPTIONS</h4>
        </section>
        <mat-accordion>
          <mat-expansion-panel [expanded]="panelState['pianoOctaves']" (opened)="setPanelState('pianoOctaves', true)" (closed)="setPanelState('pianoOctaves', false)">
            <mat-expansion-panel-header>
              <mat-panel-title style="width: 25%;">
                PIANO OCTAVES
              </mat-panel-title>
              <mat-panel-description>
                CURRENTLY: <b>{{pianoCantidadTeclas / 12}} Octaves ({{pianoCantidadTeclas}} keys)</b>
              </mat-panel-description>
            </mat-expansion-panel-header>

            <mat-card>

              <mat-slider min="12" max="60" step="12">
                <input matSliderThumb [(ngModel)]="pianoCantidadTeclas" (input)="onPianoOctavesChange()"
                  (change)="onPianoOctavesChange()" />
              </mat-slider>

            </mat-card>
          </mat-expansion-panel>

        </mat-accordion>

      </mat-card>
      <!-- /piano options -->

      <br *ngIf="showPianoOptions">

      <div class="piano-container">
        <table class="piano">
          <tr class="">
            <td *ngFor="let nn of pianoTeclas" class={{nn.classes}} [ngClass]="{
								'tonic': nn.root && nn.active,
								'third': isThird(nn),
								'seventh': isSeventh(nn),
								'active': nn.active
							}" (click)="onClickNote(nn)">
              <span>{{nn.noteStr}}</span>
            </td>
          </tr>
        </table>
      </div>
    </mat-card>

    <!--
		<mat-card>
			<app-guitar></app-guitar>
		</mat-card>

		<br>

		<mat-card>
			<app-piano></app-piano>
		</mat-card>
		-->

  </mat-card>
</div>
