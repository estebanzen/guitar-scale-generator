<mat-sidenav-container class="container">
  <mat-sidenav-content>
    <mat-toolbar color="primary"
                 class="header-box-shadow">
      <span>GUITAR TOOLS</span>
      <span *ngIf="uiService.guitarLabel$ | async as guitarLabel" style="margin-left: 16px;"> {{ guitarLabel }}</span>

      <span class="navigation-spacer"></span>

      <mat-form-field class="root-note-select" appearance="fill">
        <mat-label>NOTE ROOT</mat-label>
        <mat-select [value]="uiService.rootNote$ | async"
                    (selectionChange)="uiService.setRootNote($event.value)">
          <mat-option *ngFor="let note of notes; let index = index" [value]="index">{{ note }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field *ngIf="(uiService.selectedMode$ | async) === 'scales'" class="scale-type-select" appearance="fill">
        <mat-label>SCALE TYPE</mat-label>
        <mat-select [value]="uiService.selectedScaleType$ | async" (selectionChange)="uiService.setSelectedScaleType($event.value)">
          <mat-option *ngFor="let scale of scaleTypes" [value]="scale.id">{{ scale.name }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field *ngIf="(uiService.selectedMode$ | async) === 'chords'" class="chord-type-select" appearance="fill">
        <mat-label>CHORD TYPE</mat-label>
        <mat-select [value]="uiService.selectedChordType$ | async" (selectionChange)="uiService.setSelectedChordType($event.value)">
          <mat-option *ngFor="let chord of chordTypes" [value]="chord.shortName">{{ chord.name }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field class="selected-notes-input" appearance="fill">
        <mat-label>NOTES</mat-label>
        <input matInput [value]="selectedNotesLabel" readonly aria-label="Notas seleccionadas">
      </mat-form-field>

      <mat-button-toggle-group class="mode-selector"
                               [value]="uiService.selectedMode$ | async"
                               (change)="uiService.setSelectedMode($event.value)">
        <mat-button-toggle value="scales">
          <mat-pseudo-checkbox *ngIf="(uiService.selectedMode$ | async) === 'scales'" state="checked" aria-hidden="true" class="mat-pseudo-checkbox-minimal"></mat-pseudo-checkbox>
          <mat-icon style="margin-right: 4px;">queue_music</mat-icon> SCALES
        </mat-button-toggle>
        <mat-button-toggle value="chords">
          <mat-pseudo-checkbox *ngIf="(uiService.selectedMode$ | async) === 'chords'" state="checked" aria-hidden="true" class="mat-pseudo-checkbox-minimal"></mat-pseudo-checkbox>
          <mat-icon style="margin-right: 4px;">music_note</mat-icon> CHORDS
        </mat-button-toggle>
      </mat-button-toggle-group>

      <mat-button-toggle-group class="instrument-selector"
                               multiple
                               [value]="visibleInstruments"
                               (change)="onInstrumentsChange($event.value)">
        <mat-button-toggle value="guitar">
          <mat-pseudo-checkbox *ngIf="visibleInstruments.includes('guitar')" state="checked" aria-hidden="true" class="mat-pseudo-checkbox-minimal"></mat-pseudo-checkbox>
          GUITAR
        </mat-button-toggle>
        <mat-button-toggle value="piano">
          <mat-pseudo-checkbox *ngIf="visibleInstruments.includes('piano')" state="checked" aria-hidden="true" class="mat-pseudo-checkbox-minimal"></mat-pseudo-checkbox>
          PIANO
        </mat-button-toggle>
      </mat-button-toggle-group>

      <mat-button-toggle-group
        class="playback-instrument-toggle"
        [value]="playbackInstrument"
        (change)="onPlaybackInstrumentChange($event.value)"
        aria-label="Instrumento de reproducción">
        <mat-button-toggle value="guitar" aria-label="Sonido de guitarra">🎸</mat-button-toggle>
        <mat-button-toggle value="piano" aria-label="Sonido de piano">🎹</mat-button-toggle>
      </mat-button-toggle-group>

      <mat-form-field class="bpm-input" appearance="fill">
        <mat-label>BPM</mat-label>
        <input matInput type="number" min="40" max="240" [(ngModel)]="playbackBpm" (change)="onBpmChange()">
      </mat-form-field>
      <button mat-icon-button (click)="togglePlaybackLoop()" [color]="playbackLoop ? 'accent' : undefined" aria-label="Activar o desactivar loop">
        <mat-icon>repeat</mat-icon>
      </button>
      <button *ngIf="!isPlaying"
              mat-icon-button
              (click)="playCurrentSelection()"
              aria-label="Reproducir notas activas">
        <mat-icon>play_arrow</mat-icon>
      </button>
      <button *ngIf="isPlaying" mat-icon-button (click)="stopPlayback()" aria-label="Detener reproducción">
        <mat-icon>stop</mat-icon>
      </button>

      <button mat-icon-button
              (click)="toggleDarkTheme()"
              [attr.aria-label]="isDarkTheme ? 'Activar tema claro' : 'Activar tema oscuro'">
        <mat-icon>{{ isDarkTheme ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </mat-toolbar>

    <div class="main-content">
      <router-outlet></router-outlet>
    </div>

    <app-footer></app-footer>
  </mat-sidenav-content>
</mat-sidenav-container>
